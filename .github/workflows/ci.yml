name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DSH_RUNTIME_ROOT: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: 安装依赖与宿主测试运行时
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm rebuild node-pty koffi --ignore-scripts=false
      - name: 类型检查与完整测试
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          if (-not (Test-Path -LiteralPath "$env:DSH_RUNTIME_ROOT/@deepseek-ai/dsh-subprocess-local/lib/index.js")) {
            throw '缺少真实宿主测试运行时，不能跳过验收。'
          }
          npm run check
